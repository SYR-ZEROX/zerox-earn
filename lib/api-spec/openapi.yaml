openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ZEROX EARN rewards platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: earn
  - name: account
  - name: admin
  - name: postback
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign into an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/ApiError"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [earn]
      summary: Get dashboard balances and recent rewards
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"
        "401":
          $ref: "#/components/responses/ApiError"
  /activity:
    get:
      operationId: getActivity
      tags: [account]
      summary: Get recent account activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          $ref: "#/components/responses/ApiError"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [earn]
      summary: Get top earners
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /live-feed:
    get:
      operationId: getLiveFeed
      tags: [earn]
      summary: Get recent public reward activity
      responses:
        "200":
          description: Latest credited rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveFeedItem"
  /profile:
    get:
      operationId: getProfile
      tags: [account]
      summary: Get account and withdrawal history
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileData"
        "401":
          $ref: "#/components/responses/ApiError"
  /offerwalls:
    get:
      operationId: getOfferwalls
      tags: [earn]
      summary: List offerwall providers
      responses:
        "200":
          description: Offerwalls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offerwall"
        "401":
          $ref: "#/components/responses/ApiError"
  /offerwalls/{provider}:
    get:
      operationId: getOfferwall
      tags: [earn]
      summary: Get a configured offerwall with the current user ID applied
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            $ref: "#/components/schemas/ProviderSlug"
      responses:
        "200":
          description: Offerwall details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offerwall"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /cashout/options:
    get:
      operationId: getCashoutOptions
      tags: [account]
      summary: List supported cashout methods
      responses:
        "200":
          description: Cashout options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashoutOption"
  /withdrawals:
    get:
      operationId: getMyWithdrawals
      tags: [account]
      summary: Get the current user's withdrawal requests
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createWithdrawal
      tags: [account]
      summary: Request a cashout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /admin/offerwalls:
    get:
      operationId: getAdminOfferwalls
      tags: [admin]
      summary: List offerwall settings
      responses:
        "200":
          description: Offerwall settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offerwall"
        "403":
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateOfferwall
      tags: [admin]
      summary: Update an offerwall URL
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            $ref: "#/components/schemas/ProviderSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferwallUpdateInput"
      responses:
        "200":
          description: Updated offerwall
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offerwall"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users for administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/users/{userId}/balance:
    post:
      operationId: adjustUserBalance
      tags: [admin]
      summary: Add or deduct coins
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustmentInput"
      responses:
        "200":
          description: Updated user balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /admin/withdrawals:
    get:
      operationId: getAdminWithdrawals
      tags: [admin]
      summary: List all withdrawal requests
      responses:
        "200":
          description: Withdrawal requests with account details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawal"
        "403":
          $ref: "#/components/responses/ApiError"
  /admin/withdrawals/{withdrawalId}:
    patch:
      operationId: reviewWithdrawal
      tags: [admin]
      summary: Approve or reject a withdrawal
      parameters:
        - in: path
          name: withdrawalId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalDecisionInput"
      responses:
        "200":
          description: Reviewed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /admin/postback:
    get:
      operationId: getPostbackInfo
      tags: [admin]
      summary: Get the authenticated postback URL format
      responses:
        "200":
          description: Postback endpoint information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostbackInfo"
        "403":
          $ref: "#/components/responses/ApiError"
  /postback:
    get:
      operationId: getPostback
      tags: [postback]
      summary: Credit a verified offerwall reward
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: reward
          required: true
          schema:
            type: number
            exclusiveMinimum: 0
        - in: query
          name: provider
          required: true
          schema:
            $ref: "#/components/schemas/ProviderSlug"
        - in: query
          name: tx_id
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: secret
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reward recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostbackResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: postPostback
      tags: [postback]
      summary: Credit a verified offerwall reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostbackInput"
      responses:
        "200":
          description: Reward recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostbackResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
components:
  responses:
    ApiError:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    ProviderSlug:
      type: string
      enum: [mooffers, offery, upwall, gimiwall, revtoo]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        balance: { type: number }
        xp: { type: integer }
        level: { type: integer }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
      required: [id, username, email, balance, xp, level, role, createdAt]
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
      required: [user]
    RegisterInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
      required: [username, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]
    DashboardData:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        totalEarned: { type: number }
        pendingWithdrawals: { type: number }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        offerwalls:
          type: array
          items: { $ref: "#/components/schemas/Offerwall" }
      required: [user, totalEarned, pendingWithdrawals, recentActivity, offerwalls]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [reward, withdrawal, adjustment] }
        label: { type: string }
        amount: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, kind, label, amount, createdAt]
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        username: { type: string }
        level: { type: integer }
        balance: { type: number }
      required: [rank, username, level, balance]
    LiveFeedItem:
      type: object
      properties:
        username: { type: string }
        amount: { type: number }
        provider: { type: string }
        createdAt: { type: string, format: date-time }
      required: [username, amount, provider, createdAt]
    ProfileData:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        withdrawals:
          type: array
          items: { $ref: "#/components/schemas/Withdrawal" }
        totalEarned: { type: number }
      required: [user, withdrawals, totalEarned]
    Offerwall:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/ProviderSlug" }
        name: { type: string }
        url: { type: ["string", "null"] }
        launchUrl: { type: ["string", "null"] }
        online: { type: boolean }
        badge: { type: string }
      required: [provider, name, url, launchUrl, online, badge]
    OfferwallUpdateInput:
      type: object
      properties:
        url:
          type: ["string", "null"]
          maxLength: 2048
      required: [url]
    CashoutOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        minimum: { type: number }
        description: { type: string }
      required: [id, name, category, minimum, description]
    Withdrawal:
      type: object
      properties:
        id: { type: integer }
        method: { type: string }
        amount: { type: number }
        destination: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
      required: [id, method, amount, destination, status, createdAt, reviewedAt]
    AdminWithdrawal:
      type: object
      properties:
        id: { type: integer }
        userId: { type: string }
        username: { type: string }
        email: { type: string }
        method: { type: string }
        amount: { type: number }
        destination: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
      required: [id, userId, username, email, method, amount, destination, status, createdAt, reviewedAt]
    WithdrawalInput:
      type: object
      properties:
        method: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        destination: { type: string, minLength: 2, maxLength: 256 }
      required: [method, amount, destination]
    WithdrawalDecisionInput:
      type: object
      properties:
        status: { type: string, enum: [approved, rejected] }
      required: [status]
    AdminUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        balance: { type: number }
        xp: { type: integer }
        level: { type: integer }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
      required: [id, username, email, balance, xp, level, role, createdAt]
    BalanceAdjustmentInput:
      type: object
      properties:
        amount: { type: number, not: { const: 0 } }
        reason: { type: string, minLength: 2, maxLength: 200 }
      required: [amount, reason]
    PostbackInput:
      type: object
      properties:
        user_id: { type: string }
        reward: { type: number, exclusiveMinimum: 0 }
        provider: { $ref: "#/components/schemas/ProviderSlug" }
        tx_id: { type: string, minLength: 1, maxLength: 255 }
        secret: { type: string, minLength: 1 }
      required: [user_id, reward, provider, tx_id, secret]
    PostbackResponse:
      type: object
      properties:
        success: { type: boolean }
        balance: { type: number }
        duplicate: { type: boolean }
      required: [success, balance, duplicate]
    PostbackInfo:
      type: object
      properties:
        url: { type: string }
        template: { type: string }
        macroHelp: { type: string }
      required: [url, template, macroHelp]
